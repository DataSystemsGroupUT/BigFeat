[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Project metadata lives in setup.py for now; this file exists to declare the
# build backend and to configure pytest.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "slow: heavier cases (high ts_operation_weight_multiplier). Skip while iterating with -m 'not slow'; always run before committing.",
]
filterwarnings = [
    # BigFeat emits many benign numpy/pandas warnings during feature generation;
    # surface them without failing the suite.
    "default",
]
